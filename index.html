<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>전체 화면 목록(학교 전달용) — 순천향대학교 초·중·고 체험프로그램</title>
<style>
:root{
  --blue:#3899ca; --navy:#5b80bd; --sky:#60bddb; --green:#269e77;
  --bg:#f4f6f6; --text:#26364f; --sub:#4a576c; --bd:#bdc1c9; --bd2:#e6e8eb; --red:#e50048; --amber:#c07a12;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Malgun Gothic','맑은 고딕',sans-serif;}
html,body{height:100%;}
body{display:flex;flex-direction:column;background:#e9edf0;color:var(--text);font-size:12px;overflow:hidden;}

.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--bd);flex-shrink:0;}
.brand{font-size:14.5px;font-weight:bold;}
.brand small{font-size:11px;color:var(--sub);font-weight:normal;margin-left:6px;}
.topbar .cnt-all{margin-left:auto;font-size:11px;color:var(--sub);background:var(--bg);padding:4px 10px;border-radius:12px;}

.main{flex:1;display:flex;min-height:0;}

/* 좌 : 목록 */
.sidebar{width:290px;flex-shrink:0;background:#fff;border-right:1px solid var(--bd);overflow-y:auto;}
.grp{border-bottom:1px solid var(--bd2);}
.grp-head{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12.5px;font-weight:bold;
          background:var(--bg);position:sticky;top:0;}
.grp-tag{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.grp-tag.menu{background:#7b4fb8;} .grp-tag.stu{background:var(--blue);} .grp-tag.adm{background:var(--amber);} .grp-tag.tea{background:#b23a6b;} .grp-tag.com{background:var(--green);}
.grp-head .cnt{margin-left:auto;font-size:10.5px;color:var(--sub);font-weight:normal;}

.item{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;border-bottom:1px solid #f2f4f5;}
.item:hover{background:#f8fbff;}
.item.active{background:#eef2fb;border-left:3px solid var(--navy);padding-left:11px;}
.item .code{font-size:10px;font-weight:bold;color:var(--navy);background:var(--bg);padding:2px 6px;border-radius:3px;flex-shrink:0;min-width:30px;text-align:center;}
.item .nm{flex:1;font-size:11.5px;line-height:1.35;}
.item .nm .sub{display:block;font-size:9.5px;color:var(--sub);margin-top:1px;}

/* 중 : 뷰어 */
.viewer{flex:1;display:flex;flex-direction:column;min-width:0;background:#e9edf0;}
.vbar{display:flex;align-items:center;gap:10px;padding:9px 16px;background:#fff;border-bottom:1px solid var(--bd);flex-shrink:0;}
.vbar .vtitle{font-size:12.5px;font-weight:bold;}
.vbar .vtag{font-size:10px;font-weight:bold;padding:2px 8px;border-radius:10px;}
.vtag.menu{background:#f2ebfa;color:#7b4fb8;} .vtag.stu{background:#e8f0fe;color:var(--navy);} .vtag.adm{background:#fff3e0;color:#e65100;} .vtag.tea{background:#fbe4ec;color:#b23a6b;} .vtag.com{background:#e8f5e9;color:#2e7d32;}
.vbar .openNew{margin-left:auto;font-size:10.5px;color:var(--sub);text-decoration:none;border:1px solid var(--bd);border-radius:3px;padding:4px 9px;cursor:pointer;}
.vbar .openNew:hover{background:var(--bg);}

.stage{flex:1;display:flex;min-height:0;}
.stage iframe{width:100%;height:100%;border:none;background:#e9edf0;}

.welcome{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--sub);}
.welcome .big{font-size:15px;font-weight:bold;color:var(--text);}
.welcome .lead{font-size:11.5px;max-width:360px;text-align:center;line-height:1.6;}
</style>
</head>

var LABEL = {menu:'메뉴구조도', stu:'학생', adm:'관리자', tea:'교사', com:'공통'};
var PAGE_DATA = JSON.parse(document.getElementById('pageData').textContent);

function decodePage(file){
  var b64 = PAGE_DATA[file];
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function buildSidebar(){
  var sb = document.getElementById('sidebar');
  var total = 0;
  GROUPS.forEach(function(g){
    total += g.pages.length;
    var grp = document.createElement('div');
    grp.className = 'grp';
    var head = document.createElement('div');
    head.className = 'grp-head';
    head.innerHTML = '<span class="grp-tag '+g.key+'"></span>'+g.label+'<span class="cnt">'+g.pages.length+'건</span>';
    grp.appendChild(head);
    g.pages.forEach(function(p){
      var it = document.createElement('div');
      it.className = 'item';
      it.dataset.file = p.file;
      it.dataset.key = g.key;
      it.dataset.name = p.name;
      it.dataset.code = p.code;
      it.innerHTML = '<span class="code">'+p.code+'</span><span class="nm">'+p.name+(p.sub ? '<span class="sub">'+p.sub+'</span>' : '')+'</span>';
      it.addEventListener('click', function(){ openPage(it); });
      grp.appendChild(it);
    });
    sb.appendChild(grp);
  });
  document.getElementById('cntAll').textContent = '전체 ' + total + '개 화면';
}

var curItem = null;
var curBlobUrl = null;
function openPage(it){
  if(curItem) curItem.classList.remove('active');
  it.classList.add('active');
  curItem = it;

  document.getElementById('welcome').style.display = 'none';
  document.getElementById('vbar').style.display = 'flex';
  document.getElementById('stage').style.display = 'flex';

  var tag = document.getElementById('vtag');
  tag.className = 'vtag ' + it.dataset.key;
  tag.textContent = LABEL[it.dataset.key];
  document.getElementById('vtitle').textContent = it.dataset.name;

  var html = decodePage(it.dataset.file);
  document.getElementById('frame').srcdoc = html;

  if(curBlobUrl) URL.revokeObjectURL(curBlobUrl);
  var blob = new Blob([html], {type: 'text/html'});
  curBlobUrl = URL.createObjectURL(blob);
  document.getElementById('openNew').href = curBlobUrl;
}

buildSidebar();
var firstItem = document.querySelector('.item');
if (firstItem) openPage(firstItem);
