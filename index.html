<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>전체 화면 목록(학교 전달용) — 순천향대학교 초·중·고 체험프로그램</title>
<style>
:root{
  --blue:#3899ca; --navy:#5b80bd; --sky:#60bddb; --green:#269e77;
  --bg:#f4f6f6; --text:#26364f; --sub:#4a576c; --bd:#bdc1c9; --bd2:#e6e8eb; --red:#e50048; --amber:#c07a12;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Malgun Gothic','맑은 고딕',sans-serif;}
html,body{height:100%;}
body{display:flex;flex-direction:column;background:#e9edf0;color:var(--text);font-size:12px;overflow:hidden;}

.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--bd);flex-shrink:0;}
.brand{font-size:14.5px;font-weight:bold;}
.brand small{font-size:11px;color:var(--sub);font-weight:normal;margin-left:6px;}
.topbar .cnt-all{margin-left:auto;font-size:11px;color:var(--sub);background:var(--bg);padding:4px 10px;border-radius:12px;}

.main{flex:1;display:flex;min-height:0;}

/* 좌 : 목록 */
.sidebar{width:290px;flex-shrink:0;background:#fff;border-right:1px solid var(--bd);overflow-y:auto;}
.grp{border-bottom:1px solid var(--bd2);}
.grp-head{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12.5px;font-weight:bold;
          background:var(--bg);position:sticky;top:0;}
.grp-tag{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.grp-tag.stu{background:var(--blue);} .grp-tag.adm{background:var(--amber);} .grp-tag.tea{background:#b23a6b;} .grp-tag.com{background:var(--green);}
.grp-head .cnt{margin-left:auto;font-size:10.5px;color:var(--sub);font-weight:normal;}

.item{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;border-bottom:1px solid #f2f4f5;}
.item:hover{background:#f8fbff;}
.item.active{background:#eef2fb;border-left:3px solid var(--navy);padding-left:11px;}
.item .code{font-size:10px;font-weight:bold;color:var(--navy);background:var(--bg);padding:2px 6px;border-radius:3px;flex-shrink:0;min-width:30px;text-align:center;}
.item .nm{flex:1;font-size:11.5px;line-height:1.35;}
.item .nm .sub{display:block;font-size:9.5px;color:var(--sub);margin-top:1px;}

/* 중 : 뷰어 */
.viewer{flex:1;display:flex;flex-direction:column;min-width:0;background:#e9edf0;}
.vbar{display:flex;align-items:center;gap:10px;padding:9px 16px;background:#fff;border-bottom:1px solid var(--bd);flex-shrink:0;}
.vbar .vtitle{font-size:12.5px;font-weight:bold;}
.vbar .vtag{font-size:10px;font-weight:bold;padding:2px 8px;border-radius:10px;}
.vtag.stu{background:#e8f0fe;color:var(--navy);} .vtag.adm{background:#fff3e0;color:#e65100;} .vtag.tea{background:#fbe4ec;color:#b23a6b;} .vtag.com{background:#e8f5e9;color:#2e7d32;}
.vbar .openNew{margin-left:auto;font-size:10.5px;color:var(--sub);text-decoration:none;border:1px solid var(--bd);border-radius:3px;padding:4px 9px;cursor:pointer;}
.vbar .openNew:hover{background:var(--bg);}

.stage{flex:1;min-height:0;}
.stage iframe{width:100%;height:100%;border:none;background:#e9edf0;}

.welcome{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--sub);}
.welcome .big{font-size:15px;font-weight:bold;color:var(--text);}
.welcome .lead{font-size:11.5px;max-width:360px;text-align:center;line-height:1.6;}
</style>
</head>
<body>

  <div class="topbar">
    <span class="brand">순천향대학교 초·중·고 체험프로그램 <small>전체 화면 목록 — 학교 전달용</small></span>
    <span class="cnt-all" id="cntAll"></span>
  </div>

  <div class="main">
    <!-- 좌 : 목록 -->
    <div class="sidebar" id="sidebar"></div>

    <!-- 우 : 뷰어 -->
    <div class="viewer">
      <div class="vbar" id="vbar" style="display:none;">
        <span class="vtag" id="vtag"></span>
        <span class="vtitle" id="vtitle"></span>
        <a class="openNew" id="openNew" target="_blank">↗ 새 탭에서 열기</a>
      </div>
      <div class="stage" id="stage" style="display:none;"><iframe id="frame" title="화면 미리보기"></iframe></div>
      <div class="welcome" id="welcome">
        <div class="big">좌측 목록에서 화면을 선택하세요</div>
        <div class="lead">학생 · 관리자 · 교사 · 공통 4개 구분으로 전체 화면이 정리되어 있습니다. 내부 기획 메모(요구사항 패널·설명·표준규칙)는 제외하고 화면 목업만 담았습니다. 이 파일 하나만으로 모든 화면을 확인할 수 있습니다.</div>
      </div>
    </div>
  </div>

  <script>
  // Complete Interactive Script for Vercel Deployment Index
  const pageData = {
    "A.1.학생_회원가입.html": { cat: "stu", code: "A.1", name: "학생 회원가입", desc: "학생 사용자 회원가입 절차 화면" },
    "A.2.학생_마이페이지.html": { cat: "stu", code: "A.2", name: "학생 마이페이지", desc: "학생 개인정보 및 신청 내역 확인" }
  };

  function renderSidebar() {
    const sidebar = document.getElementById('sidebar');
    let html = '';
    const groups = [
      { id: 'stu', name: '학생 화면', tagClass: 'stu' },
      { id: 'adm', name: '관리자 화면', tagClass: 'adm' },
      { id: 'tea', name: '교사 화면', tagClass: 'tea' },
      { id: 'com', name: '공통 화면', tagClass: 'com' }
    ];

    let totalCount = 0;
    groups.forEach(g => {
      const items = Object.entries(pageData).filter(([k, v]) => v.cat === g.id);
      totalCount += items.length;
      html += `<div class="grp">
        <div class="grp-head"><span class="grp-tag ${g.tagClass}"></span>${g.name}<span class="cnt">${items.length}개</span></div>`;
      items.forEach(([file, info]) => {
        html += `<div class="item" onclick="loadPage('${file}', '${info.cat}', '${info.code} ${info.name}')">
          <span class="code">${info.code}</span>
          <span class="nm">${info.name}<small class="sub">${file}</small></span>
        </div>`;
      });
      html += `</div>`;
    });
    
    sidebar.innerHTML = html;
    document.getElementById('cntAll').innerText = `전체 화면: ${totalCount}개`;
  }

  function loadPage(file, cat, title) {
    document.getElementById('welcome').style.display = 'none';
    document.getElementById('vbar').style.display = 'flex';
    document.getElementById('stage').style.display = 'block';

    const vtag = document.getElementById('vtag');
    vtag.className = 'vtag ' + cat;
    vtag.innerText = cat.toUpperCase();

    document.getElementById('vtitle').innerText = title;
    document.getElementById('openNew').href = file;
    document.getElementById('frame').src = file;

    document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
    if(event && event.currentTarget) event.currentTarget.classList.add('active');
  }

  window.onload = renderSidebar;
  </script>
</body>
</html>
